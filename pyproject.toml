[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-benchmark-lab"
version = "0.1.0"
description = "Reproducible Korean retrieval evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
neural = ["sentence-transformers>=3.4,<6"]

[project.scripts]
retrieval-bench = "retrieval_lab.cli:main"

[tool.setuptools.packages.find]
include = ["retrieval_lab*"]
